    <script>
        (function () {
            const lightbox = document.getElementById('lightbox');
            const lightboxImagem = document.getElementById('lightbox-imagem');
            const btnFechar = document.getElementById('lightbox-fechar');

            function abrirLightbox(img) {
                lightboxImagem.src = img.src;
                lightboxImagem.alt = img.alt;
                lightbox.classList.add('show');
                document.body.style.overflow = 'hidden'; // trava o scroll da página atrás
            }

            function fecharLightbox() {
                lightbox.classList.remove('show');
                document.body.style.overflow = '';
            }

            document.querySelectorAll('.galeria-img').forEach(function (img) {
                img.addEventListener('click', function () {
                    abrirLightbox(img);
                });
            });

            btnFechar.addEventListener('click', fecharLightbox);

            // fecha ao clicar fora da imagem (no fundo escuro)
            lightbox.addEventListener('click', function (evento) {
                if (evento.target === lightbox) {
                    fecharLightbox();
                }
            });

            // fecha com a tecla Esc
            document.addEventListener('keydown', function (evento) {
                if (evento.key === 'Escape') {
                    fecharLightbox();
                }
            });
        })();
    </script>
